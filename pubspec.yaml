name: vitasnap
description: Mạng xã hội chia sẻ Khoảnh khắc ăn uống và vận động, kèm AI phân tích calo.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter

  flutter_svg: ^2.4.0
  google_sign_in: ^7.2.0
  provider: ^6.1.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/images/
    - assets/images/moments/

  fonts:
    - family: Chivo
      fonts:
        - asset: assets/fonts/Chivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Chivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Chivo-Black.ttf
          weight: 900
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

  uses-material-design: true
